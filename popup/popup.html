<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebTools</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <h1>WebTools</h1>
      <span id="version" class="version" aria-label="Version"></span>
    </header>

    <p id="reason" class="reason" hidden></p>

    <section>
      <div class="section-head">
        <h2>Capture</h2>
        <label class="check">
          <input id="stampEnabled" type="checkbox" />
          Add info
        </label>
      </div>
      <div class="grid">
        <button type="button" id="capture_viewport">Viewport</button>
        <button type="button" id="capture_viewport_delayed">Delayed</button>
        <button type="button" id="capture_fullpage">Full page</button>
        <button type="button" id="capture_region">Region</button>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>Viewport size</h2>
        <label class="check">
          <input id="showViewportHud" type="checkbox" />
          Show current
        </label>
      </div>
      <!-- Deferred: Emulate + Split window
      <button type="button" id="toggle_emulate" class="wide" aria-pressed="false">Emulate iPhone</button>
      <button type="button" id="open_split_window" class="wide">Split window</button>
      -->
      <div id="presets" class="presets" role="list"></div>
      <p class="hint">Add more sizes in Settings.</p>
    </section>

    <section>
      <h2>Tools</h2>
      <div class="grid">
        <button type="button" id="start_measure">Measure</button>
        <button type="button" id="start_qa">QA notes</button>
      </div>
    </section>

    <footer>
      <button type="button" id="settings" class="link">Settings</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
